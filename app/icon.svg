<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <linearGradient id="p1" x1="0" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#e8d5b0"/>
      <stop offset="100%" stop-color="#c4a67a"/>
    </linearGradient>
    <linearGradient id="p2" x1="0.7" y1="0" x2="0.3" y2="1">
      <stop offset="0%" stop-color="#f0e0c0"/>
      <stop offset="100%" stop-color="#d4b88a"/>
    </linearGradient>
    <linearGradient id="st" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#6a994e"/>
      <stop offset="100%" stop-color="#386641"/>
    </linearGradient>
  </defs>
  <!-- Petals - desert lily style, elongated -->
  <ellipse cx="13" cy="10" rx="3.5" ry="9" fill="url(#p1)" transform="rotate(-20 13 10)"/>
  <ellipse cx="16" cy="9" rx="3" ry="9.5" fill="url(#p2)"/>
  <ellipse cx="19" cy="10" rx="3.5" ry="9" fill="url(#p1)" transform="rotate(20 19 10)" opacity="0.85"/>
  <!-- Center stamen -->
  <ellipse cx="16" cy="7" rx="1" ry="3" fill="#c9a855" opacity="0.6"/>
  <!-- Stem -->
  <rect x="15.2" y="18" width="1.6" height="10" rx="0.8" fill="url(#st)"/>
  <!-- Leaf -->
  <ellipse cx="19.5" cy="24" rx="3.5" ry="1.2" fill="#6a994e" transform="rotate(-25 19.5 24)" opacity="0.7"/>
</svg>
